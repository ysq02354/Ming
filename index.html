<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>記帳本</title>
<style>
:root{
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #000000;
  --sub: #888888;
  --line: #d1d1d6;
  --danger: #ff5a5f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.app{max-width:520px;margin:0 auto;padding:0 16px 120px}

/* 第一行：切換帳單 */
.view-switch-wrap{
  margin: 10px -16px 0;
  padding: 0 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.view-switch-wrap::-webkit-scrollbar { display: none; }
.view-switch {
  display: inline-flex;
  gap: 8px;
  padding: 4px 0;
}
.v-btn {
  border: 1px solid var(--line);
  background: var(--card);
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  color: var(--sub);
  font-family: inherit;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
  touch-action: manipulation;
}
.v-btn.on {
  background: #111;
  color: #fff;
  border-color: #111;
  font-weight: 600;
}

/* 第二行：餘額入口 */
.balance-entry {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
  touch-action: manipulation;
}
.balance-entry:active { background: #fafafa; }
.bal-text { color: var(--text); font-weight: 600; }
.bal-amount { color: var(--sub); font-size: 13px; }
.bal-amount span { color: var(--text); font-weight: 600; }

/* 頂欄（月份切換） */
.topbar{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:14px 0 10px;
}
.month-picker-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 110px;
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.2s;
}
.month-picker-wrap:active {
  background: rgba(0,0,0,0.05);
}
.month-picker-wrap h1 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .5px;
  margin: 0;
  pointer-events: none;
}
.month-picker-wrap h1::after {
  content: ' ▾';
  font-size: 12px;
  color: var(--sub);
  vertical-align: middle;
}
.month-picker-input {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  opacity: 0;
  cursor: pointer;
  -webkit-appearance: none;
}
.mbtn{
  border:1px solid var(--line);background:var(--card);width:32px;height:32px;border-radius:8px;
  font-size:18px;color:var(--text);display:grid;place-items:center;cursor:pointer;
  touch-action: manipulation;
}
.mbtn:active{background:#e5e5ea}

/* 總覽卡片 */
.summary{
  background:#111111;
  border-radius:12px;
  padding:22px 22px 18px;color:#ffffff;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.3);
  border:1px solid #000;
  transition: all 0.3s;
}
.s-balance-label{font-size:13px;color:#a1a1a6;}
.s-balance{font-size:36px;font-weight:700;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.s-split{display:flex;align-items:center;margin-top:18px;gap:14px}
.s-item{display:flex;flex-direction:column;gap:3px;flex:1}
.s-item span{font-size:12px;color:#a1a1a6;}
.s-item strong{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.s-divider{width:1px;height:26px;background:#333333;}

/* 滑動列表區 */
.swipe-container {
  overflow: hidden;
  width: 100%;
  margin-top: 10px;
}
.swipe-wrapper {
  display: flex;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  align-items: flex-start;
}
.swipe-page {
  flex: 0 0 100%;
  width: 100%;
  min-height: 60vh;
}

/* 明細列表 */
.day{margin-top:10px}
.day-head{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:0 4px 8px;font-weight:500}
.item{
  display:flex;align-items:center;gap:12px;background:var(--card);
  padding:12px 14px;border-radius:8px;margin-bottom:8px;
  border:1px solid var(--line);
  cursor:pointer;transition:transform .1s,background .1s;
  touch-action: manipulation;
}
.item:active{transform:scale(.98);background:#fafafa}
.ico{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:19px;background:#f5f5f7;flex-shrink:0;border:1px solid var(--line)}
.ico.income{background:#e5e5ea;}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.tag-acc{font-size:10px;background:#f5f5f7;border:1px solid var(--line);padding:1px 4px;border-radius:4px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;color:var(--text)}
.amt.income{color:var(--sub)}
.empty{text-align:center;padding:70px 0;color:var(--sub);font-size:14px;line-height:2}

/* 設定頁面獨立佈局 */
.settings-header {
  font-size: 22px;
  font-weight: 800;
  margin: 20px 0 10px;
  letter-spacing: 1px;
}
.stat-block{background:var(--card);border-radius:12px;padding:16px;margin-top:16px;border:1px solid var(--line)}
.stat-title{font-size:13px;color:var(--text);font-weight:600;margin-bottom:14px}
.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stat-row:last-child{margin-bottom:0}
.stat-row .n{width:72px;font-size:13px;display:flex;align-items:center;gap:5px;flex-shrink:0}
.stat-row .bar{flex:1;height:6px;background:#f5f5f7;border-radius:4px;overflow:hidden}
.stat-row .bar i{display:block;height:100%;border-radius:4px;background:#111111;transition:width .4s}
.stat-row .bar.in i{background:#888888;}
.stat-row .v{width:76px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.data-actions{display:flex;gap:10px;margin-top:24px}
.data-actions button{
  flex:1;border:1px solid var(--line);background:var(--card);padding:12px;border-radius:8px;
  font-size:14px;font-weight:600;color:var(--text);font-family:inherit;cursor:pointer;
  touch-action: manipulation;
}

/* 底部導航 */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;
  max-width:520px;margin:0 auto;
  background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
.tab{flex:1;border:0;background:none;font-size:13px;color:var(--sub);font-weight:600;padding:8px;font-family:inherit;cursor:pointer;touch-action:manipulation;}
.tab.on{color:var(--text)}
.fab{
  flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:1px solid #333;margin-top:-24px;
  background:#111111;color:#ffffff;font-size:30px;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 16px -6px rgba(0,0,0,.4);
  transition:transform .15s;touch-action:manipulation;
}
.fab:active{transform:scale(.9)}

/* 抽屜 (記帳/管理餘額用) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-radius:12px 12px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-width:520px;margin:0 auto;max-height:92vh;overflow-y:auto;
  border-top:1px solid var(--line);
}
.sheet.on{transform:translateY(0)}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:#e5e5ea;margin:0 auto 12px}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:16px;border:1px solid var(--line)}
.seg button{
  flex:1;border:0;background:none;padding:9px;border-radius:6px;font-size:14px;font-weight:600;
  color:var(--sub);font-family:inherit;cursor:pointer;transition:.2s;touch-action:manipulation;
  position: relative; z-index: 2;
}
.seg button.on{background:#ffffff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid var(--line)}

/* 表單 */
.amount-row{display:flex;align-items:baseline;gap:6px;padding:8px 12px;margin-bottom:12px; border:1px solid var(--line); border-radius:8px; background:var(--card);}
.amount-row .cur{font-size:22px;color:var(--sub);font-weight:600}
.amount-row input{
  flex:1;border:0;outline:0;font-size:36px;font-weight:700;letter-spacing:-1px;
  background:none;font-variant-numeric:tabular-nums;min-width:0;font-family:inherit;color:var(--text);
}
.amount-row input::placeholder{color:#d1d1d6}
.sec-title{font-size:12px;color:var(--sub);margin:12px 0 8px;font-weight:600}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.acc-grid{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px; scrollbar-width:none;}
.acc-grid::-webkit-scrollbar{display:none}
.cat, .acc{
  border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;color:var(--sub);font-family:inherit;cursor:pointer;transition:.15s;
  touch-action: manipulation;
}
.acc{padding:9px 14px; white-space:nowrap; flex-direction:row; font-size:13px; font-weight:600;}
.cat span{font-size:20px;line-height:1}
.cat.on, .acc.on{background:#111111;color:#ffffff;border-color:#111111;}
.meta{display:flex;gap:10px;margin-bottom:16px}
.meta input{
  flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:13px 14px;
  font-size:14px;font-family:inherit;outline:0;color:var(--text);min-width:0;
}
.meta input:focus{border-color:var(--text)}
.meta #dateInput{flex:0 0 132px;color:var(--text)}
.sheet-actions{display:flex;gap:10px}
.btn-save{
  flex:1;border:0;padding:15px;border-radius:8px;background:#111111;color:#ffffff;
  font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;touch-action:manipulation;
}
.btn-save:active{opacity:.8}
.btn-del{
  border:1px solid var(--line);padding:15px 20px;border-radius:8px;background:var(--card);color:var(--text);
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;touch-action:manipulation;
}

/* 管理分類 */
.manage-box{background:#f9f9fb;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;}
.m-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.m-item{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:13px;}
.m-del{border:0;background:none;color:var(--danger);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;touch-action:manipulation;}
.m-add{display:flex;gap:8px}
.m-add input{flex:1;border:1px solid var(--line);padding:8px;border-radius:6px;font-size:13px;outline:none;min-width:0;}
.m-add button{border:0;background:#111;color:#fff;padding:0 12px;border-radius:6px;font-weight:600;cursor:pointer;touch-action:manipulation;}

/* 餘額管理面板 */
.bal-item {
  display: flex; align-items: center;
  padding: 10px 14px 10px 10px; background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; margin-bottom: 8px;
  transition: box-shadow 0.2s, transform 0.2s, opacity 0.2s;
  position: relative;
}
.bal-item.dragging {
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  transform: scale(1.02);
  z-index: 10;
  border-color: var(--sub);
}
.bal-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.bal-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.bal-note-tag { font-size: 11px; color: var(--sub); font-weight: 400; }
.bal-sub { font-size: 11px; color: var(--sub); }
.bal-val { font-size: 16px; font-weight: 700; display: flex; align-items: center; flex-shrink: 0; }
.bal-actions { display: flex; gap: 4px; margin-left: 8px; }
.bal-actions button {
  border: 1px solid var(--line); background: #fff; border-radius: 4px;
  width: 26px; height: 26px; font-size: 13px; color: var(--sub); cursor: pointer;
  display: grid; place-items: center; touch-action: manipulation;
}
.bal-actions button.del-btn { color: var(--danger); border-color: #ffd1d1; background: #fff0f0; }

/* 拖拽把手 */
.drag-handle {
  font-size: 20px; color: var(--line);
  padding: 8px 12px 8px 4px;
  cursor: grab;
  display: flex; align-items: center; justify-content: center;
  touch-action: none; /* 阻止瀏覽器干預 */
  user-select: none;
  -webkit-user-select: none;
}
.drag-handle:active {
  cursor: grabbing;
  color: var(--sub);
}

.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(0,0,0,.9);color:#fff;padding:12px 22px;border-radius:8px;
  font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 通用彈窗樣式 (取代原生 Alert/Confirm/Prompt) */
.modal-overlay {
  position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center; padding: 20px;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.modal-overlay.on { display: flex; }
.modal-box {
  background: var(--card); border-radius: 12px; width: 100%; max-width: 340px;
  padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.modal-box h2 { font-size: 18px; margin-bottom: 12px; color: var(--text); text-align: center; }
.modal-box p { font-size: 14px; color: var(--sub); margin-bottom: 20px; line-height: 1.5; text-align: center; white-space: pre-wrap; }
.modal-inputs { margin-bottom: 20px; }
.modal-inputs label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 6px; }
.edit-input {
  width: 100%; padding: 12px; border: 1px solid var(--line); 
  border-radius: 6px; font-size: 15px; outline: none; font-family: inherit;
}
.edit-input:focus { border-color: var(--text); }
.modal-actions { display: flex; gap: 10px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.modal-actions .btn-cancel { border: 1px solid var(--line); background: var(--card); color: var(--text); }
.modal-actions .btn-confirm { border: 0; background: var(--text); color: #fff; }
.modal-actions .btn-danger { border: 0; background: var(--danger); color: #fff; }
</style>
</head>
<body>

<div class="app">
  <!-- 主頁面專屬元素（設定頁面會隱藏） -->
  <div class="view-switch-wrap">
    <div class="view-switch" id="viewSwitchScroll"></div>
  </div>

  <div class="balance-entry" id="balanceEntry">
    <span class="bal-text">💳 管理帳戶與餘額</span>
    <span class="bal-amount">總餘額: <span id="totalBalanceDisplay">$0</span> ›</span>
  </div>

  <header class="topbar">
    <button class="mbtn" id="prevM">‹</button>
    <div class="month-picker-wrap">
      <h1 id="monthLabel">—</h1>
      <input type="date" id="monthPickerInput" class="month-picker-input">
    </div>
    <button class="mbtn" id="nextM">›</button>
  </header>

  <section class="summary">
    <div class="s-balance-label" id="sumLabel">綜合總帳單</div>
    <div class="s-balance" id="sBalance">$0</div>
    <div class="s-split">
      <div class="s-item"><span>總收入</span><strong id="sIncome">$0</strong></div>
      <div class="s-divider"></div>
      <div class="s-item"><span>總支出</span><strong id="sExpense">$0</strong></div>
    </div>
  </section>

  <main>
    <!-- 明細頁面 -->
    <div id="viewList">
      <div class="swipe-container" id="swipeContainer">
        <div class="swipe-wrapper" id="swipeWrapper"></div>
      </div>
    </div>
    
    <!-- 設定頁面（獨立切換） -->
    <div id="viewStats" hidden>
      <div class="settings-header">設定與備份</div>
      <div id="stats"></div>
      
      <div class="manage-box" style="margin-top:24px;">
        <div class="stat-title" style="margin-bottom:8px;">⚙️ 管理分類</div>
        <div class="seg" id="manageSeg" style="margin-bottom:12px;">
          <button type="button" class="on" data-mtype="expense">支出分類</button>
          <button type="button" data-mtype="income">收入分類</button>
        </div>
        <div class="m-list" id="manageList"></div>
        <div class="m-add">
          <input type="text" id="newCatEmoji" placeholder="新圖示 如🍔" maxlength="2">
          <input type="text" id="newCatName" placeholder="新分類名稱" maxlength="6">
          <button type="button" id="btnAddCat">新增</button>
        </div>
      </div>

      <div class="data-actions">
        <button type="button" id="exportBtn">匯出備份</button>
        <button type="button" id="importBtn">匯入備份</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </main>
</div>

<nav class="tabbar">
  <button type="button" class="tab on" data-view="list">明細</button>
  <button type="button" class="fab" id="fabAdd">+</button>
  <button type="button" class="tab" data-view="stats">設定</button>
</nav>

<div class="overlay" id="overlay"></div>

<!-- 記帳面板 -->
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div class="seg" id="seg">
    <button type="button" class="on" data-type="expense">支出</button>
    <button type="button" data-type="income">收入</button>
  </div>
  <div class="amount-row">
    <span class="cur">$</span>
    <input id="amtInput" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
  </div>
  
  <div class="sec-title">選擇分類</div>
  <div class="cat-grid" id="catGrid"></div>
  
  <div class="sec-title">記帳帳戶 <span style="font-size:10px;font-weight:400;color:#888;">（長按左側把手可拖動排序）</span></div>
  <div class="acc-grid" id="accGrid"></div>

  <div class="meta">
    <input type="date" id="dateInput">
    <input type="text" id="noteInput" placeholder="備註（選填）" maxlength="20">
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn-del" id="btnDel" hidden>刪除</button>
    <button type="button" class="btn-save" id="btnSave">儲存</button>
  </div>
</div>

<!-- 帳戶餘額管理面板 -->
<div class="sheet" id="balanceSheet">
  <div class="sheet-grip"></div>
  <div class="stat-title" style="text-align:center; font-size:16px; margin-bottom:16px;">💳 帳戶餘額管理</div>
  <div id="balanceList"></div>
  
  <div class="m-add" style="margin-top:12px; flex-wrap: wrap;">
    <input type="text" id="newAccName2" placeholder="帳戶名稱（可重複）" maxlength="10" style="flex:1; min-width: 100px;">
    <input type="text" id="newAccNote2" placeholder="備註（選填）" maxlength="10" style="flex:1; min-width: 100px;">
    <button type="button" id="btnAddAcc2">新增</button>
  </div>
  <button type="button" class="btn-save" style="margin-top:20px;" id="btnCloseBalance">完成</button>
</div>

<!-- 通用彈窗 (取代 alert/confirm/prompt) -->
<div class="modal-overlay" id="universalModal">
  <div class="modal-box">
    <h2 id="umTitle">提示</h2>
    <p id="umMessage" style="display:none;"></p>
    
    <div id="umInputContainer" class="modal-inputs" style="display:none;">
      <label id="umInputLabel">輸入內容</label>
      <input type="text" id="umInput" class="edit-input" autocomplete="off">
    </div>
    
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="umBtnCancel">取消</button>
      <button type="button" class="btn-confirm" id="umBtnConfirm">確認</button>
    </div>
  </div>
</div>

<!-- 修改帳戶資訊彈窗 -->
<div class="modal-overlay" id="editAccOverlay">
  <div class="modal-box">
    <h2>修改帳戶資訊</h2>
    
    <div class="modal-inputs">
      <label>帳戶名稱</label>
      <input type="text" id="editAccName" class="edit-input" maxlength="10">
    </div>
    
    <div class="modal-inputs">
      <label>備註（選填）</label>
      <input type="text" id="editAccNote" class="edit-input" maxlength="10" placeholder="如：錢包、抽屜">
    </div>
    
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="btnCancelEditAcc">取消</button>
      <button type="button" class="btn-confirm" id="btnSaveEditAcc">儲存</button>
    </div>
  </div>
</div>

<!-- 數據升級引導彈窗 -->
<div class="modal-overlay" id="migrationOverlay">
  <div class="modal-box" style="max-width:400px;">
    <h2>數據升級：帳戶綁定</h2>
    <p>系統檢測到舊版本記帳紀錄。為了防止混淆，請為舊帳戶指定對應的「新帳戶」。</p>
    <div class="migration-list" id="migrationList" style="max-height:40vh; overflow-y:auto; margin-bottom:16px; text-align:left;">
      <!-- 動態生成 -->
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-confirm" id="btnConfirmMigration" style="width:100%;">確認綁定並進入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

const DEFAULT_CATS = {
  expense: [
    {id:'food',      name:'餐飲', emoji:'🍜'},
    {id:'transport', name:'交通', emoji:'🚌'},
    {id:'shopping',  name:'購物', emoji:'🛍️'},
    {id:'home',      name:'居家', emoji:'🏠'},
    {id:'fun',       name:'娛樂', emoji:'🎮'},
    {id:'health',    name:'醫療', emoji:'💊'},
    {id:'study',     name:'學習', emoji:'📚'},
    {id:'social',    name:'人情', emoji:'🎁'},
    {id:'bill',      name:'帳單', emoji:'📄'},
    {id:'other',     name:'其他', emoji:'📦'}
  ],
  income: [
    {id:'salary',   name:'薪水', emoji:'💰'},
    {id:'bonus',    name:'獎金', emoji:'🎉'},
    {id:'invest',   name:'投資', emoji:'📈'},
    {id:'parttime', name:'兼職', emoji:'💼'},
    {id:'gift',     name:'紅包', emoji:'🧧'},
    {id:'other',    name:'其他', emoji:'📦'}
  ]
};
const DEFAULT_ACCS = [
  { id: 'a1', name: '現金', note: '', initBalance: 0 },
  { id: 'a2', name: '借記卡', note: '', initBalance: 0 },
  { id: 'a3', name: 'WeChat', note: '', initBalance: 0 },
  { id: 'a4', name: 'Alipay', note: '', initBalance: 0 },
  { id: 'a5', name: 'QQ錢包', note: '', initBalance: 0 }
];

const KEY_REC = 'ledger.v4.records';
const KEY_CAT = 'ledger.v4.cats';
const KEY_ACC = 'ledger.v4.accs';

let records = loadData(KEY_REC, []);
let myCats  = loadData(KEY_CAT, DEFAULT_CATS);
let myAccs  = loadData(KEY_ACC, DEFAULT_ACCS);

if (!myCats.expense) myCats.expense = DEFAULT_CATS.expense;
if (!myCats.income) myCats.income = DEFAULT_CATS.income;

myAccs.forEach(acc => {
  if (!acc.id) acc.id = 'a_' + uid();
  if (acc.note === undefined) acc.note = '';
});

let curMonth = todayStr().slice(0,7);
let curView  = 'list';
let editId   = null;
let curType  = 'expense';
let curCatId = myCats.expense[0].id;
let curAccId = myAccs[0].id; 
let editingAccId = null; 

let manageType = 'expense'; 
let currentViewAcc = 'ALL';
let viewAccs = ['ALL', ...myAccs.map(a => a.id)];
let currentIndex = 0;

/* ---------- 通用彈窗邏輯 ---------- */
let umOnConfirm = null;
function showModal(title, message, options = {}) {
  $('umTitle').textContent = title;
  $('umMessage').textContent = message;
  $('umMessage').style.display = message ? 'block' : 'none';
  
  if (options.isPrompt) {
    $('umInputContainer').style.display = 'block';
    $('umInputLabel').textContent = options.inputLabel || '請輸入';
    $('umInput').value = options.defaultValue || '';
    $('umInput').type = options.inputType || 'text';
    if (options.inputMode) $('umInput').inputMode = options.inputMode;
  } else {
    $('umInputContainer').style.display = 'none';
  }
  
  $('umBtnCancel').style.display = options.hideCancel ? 'none' : 'block';
  $('umBtnConfirm').textContent = options.confirmText || '確認';
  $('umBtnConfirm').className = options.danger ? 'btn-danger' : 'btn-confirm';
  
  umOnConfirm = options.onConfirm;
  $('universalModal').classList.add('on');
  
  if (options.isPrompt) {
    setTimeout(() => $('umInput').focus(), 100);
  }
}

$('umBtnCancel').onclick = () => {
  $('universalModal').classList.remove('on');
  umOnConfirm = null;
};

$('umBtnConfirm').onclick = () => {
  if (umOnConfirm) {
    const isPrompt = $('umInputContainer').style.display !== 'none';
    const value = isPrompt ? $('umInput').value : undefined;
    umOnConfirm(value);
  }
  $('universalModal').classList.remove('on');
  umOnConfirm = null;
};

/* ---------- 工具 ---------- */
function loadData(key, fallback){
  try{ 
    const d = JSON.parse(localStorage.getItem(key)); 
    return (d !== null && typeof d === 'object') ? d : fallback; 
  }
  catch(e){ return fallback; }
}
function saveAllData(){
  localStorage.setItem(KEY_REC, JSON.stringify(records));
  localStorage.setItem(KEY_CAT, JSON.stringify(myCats));
  localStorage.setItem(KEY_ACC, JSON.stringify(myAccs));
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return ymd(new Date()); }
function money(n){
  const v = Math.round(n*100)/100;
  return v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function catOf(type,id){
  return (myCats[type]||[]).find(c=>c.id===id) || {emoji:'❓',name:'其他'};
}
function getAccDisplayName(id) {
  if (id === 'deleted') return '已刪除帳戶';
  const acc = myAccs.find(a => a.id === id);
  if (!acc) return '未知帳戶';
  if (!acc.note) return acc.name;
  return `${acc.name} (${acc.note})`;
}
function getAccShortName(id) {
  if (id === 'deleted') return '已刪除';
  const acc = myAccs.find(a => a.id === id);
  if (!acc) return '未知';
  return acc.note ? `${acc.name}·${acc.note}` : acc.name;
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 1600);
}

function getAccBalance(accId) {
  if (accId === 'deleted') return 0;
  const acc = myAccs.find(a => a.id === accId);
  if (!acc) return 0;
  let bal = acc.initBalance || 0;
  records.forEach(r => {
    if (r.accountId === accId) {
      bal += (r.type === 'income' ? r.amount : -r.amount);
    }
  });
  return bal;
}

function getAccIncomeExpense(accId) {
  let inc = 0, exp = 0;
  records.forEach(r => {
    if (r.accountId === accId) {
      if (r.type === 'income') inc += r.amount;
      else exp += r.amount;
    }
  });
  return { inc, exp };
}

/* ---------- 數據遷移詢問邏輯 ---------- */
function checkAndPromptMigration() {
  const legacyRecords = records.filter(r => r.account && !r.accountId);
  if (legacyRecords.length === 0) return false; 

  const legacyNames = [...new Set(legacyRecords.map(r => r.account))];
  let html = '';
  
  legacyNames.forEach(name => {
    let defaultSelected = 'none';
    let matchedAcc = myAccs.find(a => {
      if (!a.note) return false;
      return `${a.name} (${a.note})` === name;
    });
    if (!matchedAcc) matchedAcc = myAccs.find(a => a.name === name && !a.note);
    if (!matchedAcc) matchedAcc = myAccs.find(a => a.name === name);
    if (matchedAcc) defaultSelected = matchedAcc.id;

    let optionsHtml = `<option value="none" ${defaultSelected==='none'?'selected':''}>-- 未分類/其他 --</option>`;
    optionsHtml += myAccs.map(a => {
      const display = a.note ? `${esc(a.name)} (${esc(a.note)})` : esc(a.name);
      const selected = (a.id === defaultSelected) ? 'selected' : '';
      return `<option value="${a.id}" ${selected}>${display}</option>`;
    }).join('');

    html += `
      <div class="migration-item" style="display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:#f9f9fb;">
        <span style="font-size:14px; font-weight:600;">舊帳戶：${esc(name)}</span>
        <select class="mig-select" data-old="${esc(name)}" style="padding:8px; border-radius:6px; border:1px solid var(--line); font-size:13px; outline:none; max-width:160px;">
          ${optionsHtml}
        </select>
      </div>
    `;
  });

  $('migrationList').innerHTML = html;
  $('migrationOverlay').classList.add('on');
  return true; 
}

$('btnConfirmMigration').onclick = () => {
  const selects = document.querySelectorAll('.mig-select');
  const mapping = {};
  
  selects.forEach(sel => {
    mapping[sel.dataset.old] = sel.value;
  });

  records.forEach(r => {
    if (r.account && !r.accountId) {
      const newId = mapping[r.account];
      if (newId && newId !== 'none') {
        r.accountId = newId;
        const acc = myAccs.find(a => a.id === newId);
        if (acc) r.account = acc.name;
      } else {
        r.accountId = 'unclassified';
        r.account = '未分類';
      }
    }
  });

  saveAllData();
  $('migrationOverlay').classList.remove('on');
  document.querySelector('.tabbar').style.display = 'flex';
  render(); 
  switchView('list');
  toast('帳戶綁定成功');
};

/* ---------- 主渲染 ---------- */
function render(){
  const newViewAccs = ['ALL', ...myAccs.map(a => a.id)];
  if (!newViewAccs.includes(currentViewAcc)) {
    currentViewAcc = 'ALL';
    currentIndex = 0;
  }
  viewAccs = newViewAccs;
  
  const y = curMonth.slice(0,4), m = Number(curMonth.slice(5,7));
  $('monthLabel').textContent = `${y}年${m}月`;
  $('monthPickerInput').value = curMonth + '-01';
  
  let totalBal = 0;
  myAccs.forEach(a => totalBal += getAccBalance(a.id));
  $('totalBalanceDisplay').textContent = '$' + money(totalBal);

  $('viewSwitchScroll').innerHTML = viewAccs.map(accId => {
    const isOn = accId === currentViewAcc ? 'on' : '';
    const displayName = accId === 'ALL' ? '總帳單' : getAccDisplayName(accId);
    return `<button type="button" class="v-btn ${isOn}" data-acc="${accId}">${esc(displayName)}</button>`;
  }).join('');

  const rs = records.filter(r => r.date.startsWith(curMonth));
  let pagesHtml = '';
  viewAccs.forEach(accId => {
    const accRs = accId === 'ALL' ? rs : rs.filter(r => r.accountId === accId);
    pagesHtml += `<div class="swipe-page" data-acc="${accId}">
      ${buildListHtml(accRs, accId === 'ALL')}
    </div>`;
  });
  $('swipeWrapper').innerHTML = pagesHtml;

  updateTopUI(currentIndex);
  updateView(currentIndex, false);
  
  renderStats(rs);
  renderBalanceList();
}

function updateTopUI(index) {
  currentViewAcc = viewAccs[index];
  document.querySelectorAll('.v-btn').forEach(b => 
    b.classList.toggle('on', b.dataset.acc === currentViewAcc)
  );
  
  const activeBtn = document.querySelector(`.v-btn[data-acc="${currentViewAcc}"]`);
  if (activeBtn) {
    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
  
  const rs = records.filter(r => r.date.startsWith(curMonth));
  const curRs = currentViewAcc === 'ALL' ? rs : rs.filter(r => r.accountId === currentViewAcc);
  const curInc = curRs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  const curExp = curRs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
  
  $('sumLabel').textContent = currentViewAcc === 'ALL' ? '綜合總帳單' : `${getAccDisplayName(currentViewAcc)} 帳單`;
  $('sIncome').textContent  = '$' + money(curInc);
  $('sExpense').textContent = '$' + money(curExp);
  $('sBalance').textContent = '$' + money(curInc - curExp);
}

function updateView(index, animate = true) {
  currentIndex = index;
  const wrapper = $('swipeWrapper');
  wrapper.style.transition = animate ? 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
  wrapper.style.transform = `translateX(-${index * 100}%)`;
  updateTopUI(index);
}

function buildListHtml(rs, isAll) {
  if (!rs.length) return '<div class="empty">這個月還沒有紀錄<br><span>點下方 + 開始記帳</span></div>';
  const groups = {};
  rs.forEach(r => (groups[r.date] = groups[r.date] || []).push(r));
  let html = '';
  Object.keys(groups).sort().reverse().forEach(d => {
    const items = groups[d].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const out = items.filter(i=>i.type==='expense').reduce((s,i)=>s+i.amount,0);
    const inc = items.filter(i=>i.type==='income').reduce((s,i)=>s+i.amount,0);
    const parts = [];
    if(out) parts.push('支出 ' + money(out));
    if(inc) parts.push('收入 ' + money(inc));

    html += `<div class="day">
      <div class="day-head"><span>${dayLabel(d)}</span><span>${parts.join(' · ')}</span></div>`;
    items.forEach(it => {
      const c = catOf(it.type, it.cat);
      const accTag = isAll ? `<span class="tag-acc">${esc(getAccShortName(it.accountId))}</span>` : '';
      html += `<div class="item" data-id="${it.id}">
        <div class="ico ${it.type}">${c.emoji}</div>
        <div class="info">
          <div class="name">${esc(c.name)}
            ${accTag}
            ${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}
          </div>
        </div>
        <div class="amt ${it.type}">${it.type==='expense'?'−':'+'}${money(it.amount)}</div>
      </div>`;
    });
    html += '</div>';
  });
  return html;
}

function dayLabel(d){
  const t = todayStr();
  if(d === t) return '今天';
  const y = new Date(); y.setDate(y.getDate()-1);
  if(d === ymd(y)) return '昨天';
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getMonth()+1}月${dt.getDate()}日 週${'日一二三四五六'[dt.getDay()]}`;
}

/* ---------- 設定與備份 ---------- */
function renderStats(rs){
  $('stats').innerHTML = statBlock(rs,'expense','支出') + statBlock(rs,'income','收入');
  renderManageCats();
}

function statBlock(rs, type, title){
  const items = rs.filter(r => r.type === type);
  if(!items.length) return '';
  const map = new Map();
  items.forEach(r => map.set(r.cat, (map.get(r.cat)||0) + r.amount));
  const arr = [...map].map(([id, amt]) => {
    const c = catOf(type, id);
    return {emoji:c.emoji, name:c.name, amt};
  }).sort((a,b)=>b.amt-a.amt);

  const max = arr[0].amt;
  const total = arr.reduce((s,x)=>s+x.amt,0);

  return `<div class="stat-block">
    <div class="stat-title">${title} · 共 ${money(total)}</div>
    ${arr.map(x => `<div class="stat-row">
      <div class="n">${x.emoji} ${esc(x.name)}</div>
      <div class="bar ${type==='income'?'in':''}"><i style="width:${Math.max(4, x.amt/max*100)}%"></i></div>
      <div class="v">${money(x.amt)}</div>
    </div>`).join('')}
  </div>`;
}

function renderManageCats(){
  const list = myCats[manageType] || [];
  $('manageList').innerHTML = list.map(c => `
    <div class="m-item">
      <span>${c.emoji || '📌'} ${esc(c.name)}</span>
      <button type="button" class="m-del" data-cat="${c.id}">×</button>
    </div>
  `).join('');
}

function renderBalanceList() {
  let html = '';
  myAccs.forEach(a => {
    const bal = getAccBalance(a.id);
    const { inc, exp } = getAccIncomeExpense(a.id);
    const noteStr = a.note ? `<span class="bal-note-tag">[${esc(a.note)}]</span>` : '';
    
    html += `
      <div class="bal-item" data-id="${a.id}">
        <div class="drag-handle">≡</div>
        <div class="bal-info">
          <div class="bal-name">${esc(a.name)} ${noteStr}</div>
          <div class="bal-sub">初始: $${money(a.initBalance||0)} | 收: +$${money(inc)} 支: -$${money(exp)}</div>
        </div>
        <div class="bal-val">
          <span>$${money(bal)}</span>
          <div class="bal-actions">
            <button type="button" class="edit-acc" data-id="${a.id}" title="修改名稱與備註">📝</button>
            <button type="button" class="edit-bal" data-id="${a.id}" title="修改餘額">✎</button>
            <button type="button" class="del-btn" data-id="${a.id}" title="刪除帳戶">🗑️</button>
          </div>
        </div>
      </div>
    `;
  });
  $('balanceList').innerHTML = html;
}

/* ---------- 頁面切換 ---------- */
function shiftMonth(n){
  const [y,m] = curMonth.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  curMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}

function switchView(v){
  curView = v;
  const isList = (v === 'list');
  
  $('viewList').hidden  = !isList;
  $('viewStats').hidden = isList;
  
  document.querySelector('.view-switch-wrap').style.display = isList ? 'block' : 'none';
  document.getElementById('balanceEntry').style.display = isList ? 'flex' : 'none';
  document.querySelector('.summary').style.display = isList ? 'block' : 'none';
  document.querySelector('.topbar').style.display = isList ? 'flex' : 'none';
  
  document.getElementById('fabAdd').style.display = isList ? 'grid' : 'none';
  
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  
  if (!isList) window.scrollTo(0, 0);
}

/* ---------- 記帳面板 ---------- */
function defaultDate(){
  const t = todayStr();
  return t.startsWith(curMonth) ? t : curMonth + '-01';
}
function renderCatsAndAccs(){
  const list = myCats[curType] || [];
  if(!list.some(c=>c.id===curCatId)) curCatId = list.length > 0 ? list[0].id : null;
  
  $('catGrid').innerHTML = list.map(c =>
    `<button type="button" class="cat ${c.id===curCatId?'on':''}" data-cat="${c.id}">
       <span>${c.emoji || '📌'}</span>${c.name}
     </button>`
  ).join('');

  if(!myAccs.some(a => a.id === curAccId)) curAccId = myAccs[0].id;
  $('accGrid').innerHTML = myAccs.map(a => {
    const displayName = a.note ? `${a.name}·${a.note}` : a.name;
    return `<button type="button" class="acc ${a.id===curAccId?'on':''}" data-id="${a.id}">${esc(displayName)}</button>`;
  }).join('');
}

function openSheet(rec){
  editId  = rec ? rec.id : null;
  curType = rec ? rec.type : 'expense';
  curCatId = rec ? rec.cat : (myCats.expense[0] ? myCats.expense[0].id : null);
  curAccId = rec ? (rec.accountId || myAccs[0].id) : 
               (currentViewAcc !== 'ALL' ? currentViewAcc : myAccs[0].id);

  $('amtInput').value  = rec ? String(rec.amount) : '';
  $('noteInput').value = rec ? (rec.note||'') : '';
  $('dateInput').value = rec ? rec.date : defaultDate();
  $('btnDel').hidden   = !rec;

  document.querySelectorAll('#seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.type === curType));
  renderCatsAndAccs();

  $('overlay').classList.add('on');
  $('sheet').classList.add('on');
  if(!rec) setTimeout(()=>$('amtInput').focus(), 340);
}
function closeSheet(){
  $('overlay').classList.remove('on');
  $('sheet').classList.remove('on');
  $('balanceSheet').classList.remove('on');
  $('amtInput').blur();
  $('noteInput').blur();
}
function saveRecord(){
  const amt = parseFloat($('amtInput').value);
  if(!amt || amt <= 0){ toast('請輸入金額'); return; }
  if(!curCatId){ toast('請選擇分類'); return; }

  const date = $('dateInput').value || defaultDate();
  const note = $('noteInput').value.trim();
  const accName = myAccs.find(a=>a.id===curAccId)?.name || '';

  if(editId){
    const r = records.find(x=>x.id===editId);
    if(r) Object.assign(r, {type:curType, amount:amt, cat:curCatId, accountId:curAccId, account:accName, date, note});
  }else{
    records.push({
      id: uid(), type: curType, amount: amt, cat: curCatId, accountId: curAccId, account:accName,
      date, note, createdAt: Date.now()
    });
  }
  saveAllData();
  closeSheet();
  curMonth = date.slice(0,7);
  render();
  toast(editId ? '已更新' : '已記下');
  editId = null;
}
function deleteRecord(){
  if(!editId) return;
  showModal('刪除紀錄', '確定要刪除這筆紀錄嗎？', {
    confirmText: '刪除',
    danger: true,
    onConfirm: () => {
      records = records.filter(r => r.id !== editId);
      saveAllData(); closeSheet(); render(); toast('已刪除');
      editId = null;
    }
  });
}

/* ---------- 匯出 / 匯入 ---------- */
function exportData(){
  const backup = { records, myCats, myAccs };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ledger-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('備份已匯出');
}
function importData(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      
      const processData = () => {
        if(Array.isArray(data)){
          records = data;
        } else if(data.records){
          records = data.records;
          if(data.myCats) myCats = data.myCats;
          if(data.myAccs) myAccs = data.myAccs;
        }
        
        myAccs.forEach(acc => {
          if (!acc.id) acc.id = 'a_' + uid();
          if (acc.note === undefined) acc.note = '';
        });

        saveAllData(); 
        if (!checkAndPromptMigration()) render();
        toast('備份已還原');
      };

      if(Array.isArray(data) || data.records) {
        if(Array.isArray(data)) {
            processData();
        } else {
            showModal('匯入備份', '匯入備份會覆蓋現有的數據，包含自定義的分類和帳戶，確定嗎？', {
              confirmText: '確定匯入',
              onConfirm: processData
            });
        }
      }
    }catch(err){ toast('檔案格式錯誤'); }
  };
  reader.readAsText(file);
}

/* ---------- 手勢滑動事件 (主頁面) ---------- */
let startX = 0, startY = 0, isSwiping = false, touchMoved = false;
const container = $('swipeContainer');

container.addEventListener('touchstart', e => {
  if (e.touches.length > 1 || curView !== 'list') return;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  isSwiping = false;
  touchMoved = false;
  $('swipeWrapper').style.transition = 'none';
}, { passive: false });

container.addEventListener('touchmove', e => {
  if (e.touches.length > 1 || curView !== 'list') return;
  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;
  
  if (!isSwiping && !touchMoved) {
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      isSwiping = true;
    } else if (Math.abs(dy) > 10) {
      touchMoved = true;
      return;
    }
  }
  
  if (isSwiping) {
    e.preventDefault();
    const offset = -currentIndex * container.clientWidth + dx;
    $('swipeWrapper').style.transform = `translateX(${offset}px)`;
  }
}, { passive: false });

container.addEventListener('touchend', e => {
  if (!isSwiping || curView !== 'list') return;
  $('swipeWrapper').style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
  const dx = e.changedTouches[0].clientX - startX;
  const threshold = container.clientWidth * 0.2;
  
  if (dx > threshold && currentIndex > 0) {
    currentIndex--;
  } else if (dx < -threshold && currentIndex < viewAccs.length - 1) {
    currentIndex++;
  }
  
  updateView(currentIndex);
});

/* ---------- 長按拖拽排序事件 (餘額管理頁面) ---------- */
let dragItem = null;
let dragStartY = 0;
let pressTimer = null;
let isDragging = false;

const balanceListEl = $('balanceList');

// 點擊事件需要區分是「點按鈕」還是「點拖拽把手」，所以改成這樣
$('balanceList').addEventListener('click', e => {
  if (isDragging) return; // 剛拖拽完不要觸發點擊

  // 1. 修改帳戶名稱與備註
  const editAccBtn = e.target.closest('.edit-acc');
  if (editAccBtn) {
    const accId = editAccBtn.dataset.id;
    const acc = myAccs.find(a => a.id === accId);
    if (!acc) return;
    
    editingAccId = accId;
    $('editAccName').value = acc.name;
    $('editAccNote').value = acc.note || '';
    $('editAccOverlay').classList.add('on');
    return;
  }

  // 2. 修改餘額
  const editBalBtn = e.target.closest('.edit-bal');
  if (editBalBtn) {
    const accId = editBalBtn.dataset.id;
    const currentBal = getAccBalance(accId);
    
    showModal('修改餘額', `修改「${getAccDisplayName(accId)}」的當前真實餘額：\n(輸入負數代表欠款)`, {
      isPrompt: true,
      inputLabel: '當前餘額',
      defaultValue: currentBal,
      inputMode: 'decimal',
      confirmText: '儲存',
      onConfirm: (newBalStr) => {
        const newBal = parseFloat(newBalStr);
        if (!isNaN(newBal)) {
          const { inc, exp } = getAccIncomeExpense(accId);
          const acc = myAccs.find(a => a.id === accId);
          acc.initBalance = newBal - inc + exp;
          saveAllData();
          render();
          toast('餘額已更新');
        } else {
          toast('請輸入有效數字');
        }
      }
    });
    return;
  }

  // 3. 刪除帳戶
  const delBtn = e.target.closest('.del-btn');
  if (delBtn) {
    const accId = delBtn.dataset.id;
    
    if (myAccs.length <= 1) {
      toast('必須保留至少一個帳戶');
      return;
    }

    const relatedRecords = records.filter(r => r.accountId === accId);
    let msg = `確定要刪除帳戶「${getAccDisplayName(accId)}」嗎？`;
    if (relatedRecords.length > 0) {
      msg = `該帳戶下有 ${relatedRecords.length} 筆記帳紀錄。\n刪除帳戶後，這些紀錄的帳戶標籤將顯示為「已刪除」，且不再計入任何帳戶餘額。\n確定要刪除嗎？`;
    }

    showModal('刪除帳戶', msg, {
      confirmText: '確定刪除',
      danger: true,
      onConfirm: () => {
        myAccs = myAccs.filter(a => a.id !== accId);
        records.forEach(r => {
          if (r.accountId === accId) {
            r.accountId = 'deleted';
            r.account = '已刪除帳戶';
          }
        });
        
        saveAllData();
        if (currentViewAcc === accId) {
          currentViewAcc = 'ALL';
          currentIndex = 0;
        }
        if (curAccId === accId) {
          curAccId = myAccs.length > 0 ? myAccs[0].id : null;
        }
        render();
        toast('帳戶已刪除');
      }
    });
  }
});

// 觸控開始 (只有按在 .drag-handle 上才觸發)
balanceListEl.addEventListener('touchstart', e => {
  const handle = e.target.closest('.drag-handle');
  if (!handle) return;

  const item = handle.closest('.bal-item');
  const touch = e.touches[0];
  
  dragStartY = touch.clientY;
  isDragging = false;
  
  // 設定長按計時器，200ms 後啟動拖拽模式
  pressTimer = setTimeout(() => {
    isDragging = true;
    dragItem = item;
    item.classList.add('dragging');
    
    // 震動回饋（如果設備支援）
    if (navigator.vibrate) navigator.vibrate(20);
    
    // 阻止預設滾動
    e.preventDefault(); 
  }, 200);
}, { passive: false });

// 觸控移動
balanceListEl.addEventListener('touchmove', e => {
  // 如果還沒進入拖拽狀態，檢查使用者是不是在滑動（如果是，就取消長按）
  if (!isDragging) {
    if (pressTimer) {
      const touch = e.touches[0];
      if (Math.abs(touch.clientY - dragStartY) > 10) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    }
    return;
  }

  // 進入拖拽狀態
  e.preventDefault(); // 阻止頁面滾動
  const touch = e.touches[0];
  const elementAtPoint = document.elementFromPoint(touch.clientX, touch.clientY);
  
  if (!elementAtPoint) return;
  
  const targetItem = elementAtPoint.closest('.bal-item');
  
  // 如果滑過其他卡片，進行位置交換
  if (targetItem && targetItem !== dragItem) {
    const rect = targetItem.getBoundingClientRect();
    const targetMiddleY = rect.top + rect.height / 2;
    
    if (touch.clientY < targetMiddleY) {
      balanceListEl.insertBefore(dragItem, targetItem);
    } else {
      balanceListEl.insertBefore(dragItem, targetItem.nextSibling);
    }
  }
}, { passive: false });

// 觸控結束
balanceListEl.addEventListener('touchend', e => {
  if (pressTimer) {
    clearTimeout(pressTimer);
    pressTimer = null;
  }
  
  if (isDragging) {
    dragItem.classList.remove('dragging');
    dragItem = null;
    
    // 給一個短暫的延遲，防止 touchend 觸發了 click 事件
    setTimeout(() => { isDragging = false; }, 100);

    // 重新讀取 DOM 順序，更新 myAccs 陣列
    const newOrderIds = [...balanceListEl.querySelectorAll('.bal-item')].map(el => el.dataset.id);
    const newAccs = [];
    newOrderIds.forEach(id => {
      const acc = myAccs.find(a => a.id === id);
      if (acc) newAccs.push(acc);
    });
    
    myAccs = newAccs;
    saveAllData();
    
    // 重新渲染全局（這樣首頁的 Tab 順序也會即時改變）
    render();
    toast('排序已更新');
  }
});


/* --- 修改帳戶資訊彈窗的事件 --- */
$('btnCancelEditAcc').onclick = () => {
  $('editAccOverlay').classList.remove('on');
  editingAccId = null;
};

$('btnSaveEditAcc').onclick = () => {
  if (!editingAccId) return;
  const acc = myAccs.find(a => a.id === editingAccId);
  if (!acc) return;
  
  const newName = $('editAccName').value.trim();
  const newNote = $('editAccNote').value.trim();
  
  if (!newName) {
    toast('請輸入帳戶名稱');
    return;
  }
  
  acc.name = newName;
  acc.note = newNote;
  
  saveAllData();
  $('editAccOverlay').classList.remove('on');
  editingAccId = null;
  render();
  toast('帳戶資訊已更新');
};

$('btnAddAcc2').onclick = () => {
  const name = $('newAccName2').value.trim();
  const note = $('newAccNote2').value.trim();
  if(!name) { toast('請輸入帳戶名稱'); return; }
  
  myAccs.push({ id: 'a_'+uid(), name, note, initBalance: 0 });
  saveAllData();
  $('newAccName2').value = '';
  $('newAccNote2').value = '';
  render();
  toast('帳戶已新增');
};

/* ---------- 其他全局事件 ---------- */
$('prevM').onclick = () => shiftMonth(-1);
$('nextM').onclick = () => shiftMonth(1);
$('fabAdd').onclick = () => openSheet(null);
$('overlay').onclick = closeSheet;
$('btnSave').onclick = saveRecord;
$('btnDel').onclick = deleteRecord;

$('monthPickerInput').addEventListener('change', function(e) {
  if (!this.value) return;
  curMonth = this.value.slice(0, 7);
  render();
});

$('exportBtn').onclick = exportData;
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  if(e.target.files[0]) importData(e.target.files[0]);
  e.target.value = '';
};

$('viewSwitchScroll').addEventListener('click', e => {
  const btn = e.target.closest('.v-btn');
  if (!btn) return;
  const accId = btn.dataset.acc;
  const index = viewAccs.indexOf(accId);
  if (index !== -1) {
    updateView(index);
  }
});

$('balanceEntry').onclick = () => {
  $('overlay').classList.add('on');
  $('balanceSheet').classList.add('on');
};
$('btnCloseBalance').onclick = closeSheet;

document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => switchView(b.dataset.view);
});

document.querySelectorAll('#seg button').forEach(b => {
  b.onclick = () => {
    curType = b.dataset.type;
    curCatId = myCats[curType].length > 0 ? myCats[curType][0].id : null;
    document.querySelectorAll('#seg button').forEach(x =>
      x.classList.toggle('on', x.dataset.type === curType));
    renderCatsAndAccs();
  };
});

$('catGrid').addEventListener('click', e => {
  const btn = e.target.closest('.cat');
  if(!btn) return;
  curCatId = btn.dataset.cat;
  document.querySelectorAll('.cat').forEach(x =>
    x.classList.toggle('on', x.dataset.cat === curCatId));
});

$('accGrid').addEventListener('click', e => {
  const btn = e.target.closest('.acc');
  if(!btn) return;
  curAccId = btn.dataset.id;
  document.querySelectorAll('.acc').forEach(x =>
    x.classList.toggle('on', x.dataset.id === curAccId));
});

$('swipeWrapper').addEventListener('click', e => {
  const el = e.target.closest('.item');
  if(!el) return;
  const rec = records.find(r => r.id === el.dataset.id);
  if(rec) openSheet(rec);
});

$('amtInput').addEventListener('input', e => {
  let v = e.target.value.replace(/[^\d.]/g, '');
  const p = v.split('.');
  if(p.length > 2) v = p[0] + '.' + p.slice(1).join('');
  const q = v.split('.');
  if(q[1] && q[1].length > 2) v = q[0] + '.' + q[1].slice(0,2);
  if(v.startsWith('.')) v = '0' + v;
  e.target.value = v;
});

$('manageSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  manageType = btn.dataset.mtype;
  document.querySelectorAll('#manageSeg button').forEach(x =>
    x.classList.toggle('on', x.dataset.mtype === manageType));
  renderManageCats();
});

$('btnAddCat').onclick = () => {
  const emoji = $('newCatEmoji').value.trim() || '📌';
  const name  = $('newCatName').value.trim();
  if(!name) { toast('請輸入分類名稱'); return; }
  
  if (!myCats[manageType]) myCats[manageType] = [];
  const newId = 'c_' + uid();
  myCats[manageType].push({ id: newId, name, emoji });
  saveAllData();
  
  $('newCatEmoji').value = '';
  $('newCatName').value = '';
  renderManageCats();
  renderCatsAndAccs(); 
  toast('分類已新增');
};

$('manageList').addEventListener('click', e => {
  const btn = e.target.closest('.m-del');
  if(!btn) return;
  const catId = btn.dataset.cat;
  
  showModal('刪除分類', '刪除後，已使用該分類的記帳紀錄將顯示為「其他」。確定刪除？', {
    confirmText: '刪除',
    danger: true,
    onConfirm: () => {
      myCats[manageType] = myCats[manageType].filter(c => c.id !== catId);
      saveAllData();
      renderManageCats();
      renderCatsAndAccs();
      toast('已刪除');
    }
  });
});

// 啟動時檢查是否需要遷移
if (!checkAndPromptMigration()) {
  render();
  switchView('list');
} else {
  document.querySelector('.tabbar').style.display = 'none';
}
</script>
