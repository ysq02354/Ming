<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>記帳本</title>
<style>
:root{
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #000000;
  --sub: #888888;
  --line: #d1d1d6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:520px;margin:0 auto;padding:0 16px 120px}

/* 頂欄 */
.topbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:14px 0 10px;background:var(--bg);
}
.topbar h1{font-size:16px;font-weight:600;letter-spacing:.5px;min-width:110px;text-align:center}
.mbtn{
  border:1px solid var(--line);background:var(--card);width:32px;height:32px;border-radius:8px;
  font-size:18px;color:var(--text);display:grid;place-items:center;cursor:pointer;
}
.mbtn:active{background:#e5e5ea}

/* 總覽卡片 */
.summary{
  background:#111111;
  border-radius:12px;
  padding:22px 22px 18px;color:#ffffff;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.3);
  border:1px solid #000;
}
.s-balance-label{font-size:13px;color:#a1a1a6;}
.s-balance{font-size:36px;font-weight:700;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.s-split{display:flex;align-items:center;margin-top:18px;gap:14px}
.s-item{display:flex;flex-direction:column;gap:3px;flex:1}
.s-item span{font-size:12px;color:#a1a1a6;}
.s-item strong{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.s-divider{width:1px;height:26px;background:#333333;}

/* 明細 */
.day{margin-top:20px}
.day-head{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:0 4px 8px;font-weight:500}
.item{
  display:flex;align-items:center;gap:12px;background:var(--card);
  padding:12px 14px;border-radius:8px;margin-bottom:8px;
  border:1px solid var(--line);
  cursor:pointer;transition:transform .1s,background .1s;
}
.item:active{transform:scale(.98);background:#fafafa}
.ico{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:19px;background:#f5f5f7;flex-shrink:0;border:1px solid var(--line)}
.ico.income{background:#e5e5ea;}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.tag-acc{font-size:10px;background:#f5f5f7;border:1px solid var(--line);padding:1px 4px;border-radius:4px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;color:var(--text)}
.amt.income{color:var(--sub)}
.empty{text-align:center;padding:70px 0;color:var(--sub);font-size:14px;line-height:2}

/* 統計 */
.stat-block{background:var(--card);border-radius:12px;padding:16px;margin-top:16px;border:1px solid var(--line)}
.stat-title{font-size:13px;color:var(--text);font-weight:600;margin-bottom:14px}
.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stat-row:last-child{margin-bottom:0}
.stat-row .n{width:72px;font-size:13px;display:flex;align-items:center;gap:5px;flex-shrink:0}
.stat-row .bar{flex:1;height:6px;background:#f5f5f7;border-radius:4px;overflow:hidden}
.stat-row .bar i{display:block;height:100%;border-radius:4px;background:#111111;transition:width .4s}
.stat-row .bar.in i{background:#888888;}
.stat-row .v{width:76px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}

/* 數據按鈕 */
.data-actions{display:flex;gap:10px;margin-top:24px}
.data-actions button{
  flex:1;border:1px solid var(--line);background:var(--card);padding:12px;border-radius:8px;
  font-size:14px;font-weight:600;color:var(--text);font-family:inherit;cursor:pointer;
}
.data-actions button:active{background:#f5f5f7}

/* 底部導航 */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;
  max-width:520px;margin:0 auto;
  background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
.tab{flex:1;border:0;background:none;font-size:13px;color:var(--sub);font-weight:600;padding:8px;font-family:inherit;cursor:pointer}
.tab.on{color:var(--text)}
.fab{
  flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:1px solid #333;margin-top:-24px;
  background:#111111;color:#ffffff;font-size:30px;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 16px -6px rgba(0,0,0,.4);
  transition:transform .15s;
}
.fab:active{transform:scale(.9)}

/* 抽屜 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-radius:12px 12px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-width:520px;margin:0 auto;max-height:92vh;overflow-y:auto;
  border-top:1px solid var(--line);
}
.sheet.on{transform:translateY(0)}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:#e5e5ea;margin:0 auto 12px}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:16px;border:1px solid var(--line)}
.seg button{
  flex:1;border:0;background:none;padding:9px;border-radius:6px;font-size:14px;font-weight:600;
  color:var(--sub);font-family:inherit;cursor:pointer;transition:.2s;
}
.seg button.on{background:#ffffff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid var(--line)}

/* 表單輸入區 */
.amount-row{display:flex;align-items:baseline;gap:6px;padding:8px 12px;margin-bottom:12px; border:1px solid var(--line); border-radius:8px; background:var(--card);}
.amount-row .cur{font-size:22px;color:var(--sub);font-weight:600}
.amount-row input{
  flex:1;border:0;outline:0;font-size:36px;font-weight:700;letter-spacing:-1px;
  background:none;font-variant-numeric:tabular-nums;min-width:0;font-family:inherit;color:var(--text);
}
.amount-row input::placeholder{color:#d1d1d6}

.sec-title{font-size:12px;color:var(--sub);margin:12px 0 8px;font-weight:600}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.acc-grid{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px; scrollbar-width:none;}
.acc-grid::-webkit-scrollbar{display:none}

.cat, .acc{
  border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;color:var(--sub);font-family:inherit;cursor:pointer;transition:.15s;
}
.acc{padding:9px 14px; white-space:nowrap; flex-direction:row; font-size:13px; font-weight:600;}
.cat span{font-size:20px;line-height:1}
.cat.on, .acc.on{background:#111111;color:#ffffff;border-color:#111111;}

.meta{display:flex;gap:10px;margin-bottom:16px}
.meta input{
  flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:13px 14px;
  font-size:14px;font-family:inherit;outline:0;color:var(--text);min-width:0;
}
.meta input:focus{border-color:var(--text)}
.meta #dateInput{flex:0 0 132px;color:var(--text)}

.sheet-actions{display:flex;gap:10px}
.btn-save{
  flex:1;border:0;padding:15px;border-radius:8px;
  background:#111111;color:#ffffff;
  font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
}
.btn-save:active{opacity:.8}
.btn-del{
  border:1px solid var(--line);padding:15px 20px;border-radius:8px;background:var(--card);color:var(--text);
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
}

/* 管理分類彈窗 */
.manage-box{background:#f9f9fb;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px;}
.m-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.m-item{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:13px;}
.m-del{border:0;background:none;color:#ff5a5f;font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.m-add{display:flex;gap:8px}
.m-add input{flex:1;border:1px solid var(--line);padding:8px;border-radius:6px;font-size:13px;outline:none;min-width:0;}
.m-add input[name="emoji"]{flex:0 0 50px;text-align:center;}
.m-add button{border:0;background:#111;color:#fff;padding:0 12px;border-radius:6px;font-weight:600;cursor:pointer;}

.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(0,0,0,.9);color:#fff;padding:12px 22px;border-radius:8px;
  font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="mbtn" id="prevM">‹</button>
    <h1 id="monthLabel">—</h1>
    <button class="mbtn" id="nextM">›</button>
  </header>

  <section class="summary">
    <div class="s-balance-label">綜合總帳單</div>
    <div class="s-balance" id="sBalance">$0</div>
    <div class="s-split">
      <div class="s-item"><span>總收入</span><strong id="sIncome">$0</strong></div>
      <div class="s-divider"></div>
      <div class="s-item"><span>總支出</span><strong id="sExpense">$0</strong></div>
    </div>
  </section>

  <main>
    <div id="viewList">
      <div id="list"></div>
    </div>
    <div id="viewStats" hidden>
      <div id="stats"></div>
      
      <!-- 分類管理按鈕 -->
      <div class="manage-box" style="margin-top:24px;">
        <div class="stat-title" style="margin-bottom:8px;">⚙️ 管理分類</div>
        <div style="font-size:12px; color:#888; margin-bottom:12px;">點擊下方切換管理「支出」或「收入」的分類。</div>
        <div class="seg" id="manageSeg" style="margin-bottom:12px;">
          <button class="on" data-mtype="expense">管理支出分類</button>
          <button data-mtype="income">管理收入分類</button>
        </div>
        <div class="m-list" id="manageList"></div>
        <div class="m-add">
          <input type="text" id="newCatEmoji" placeholder="🍔" maxlength="2">
          <input type="text" id="newCatName" placeholder="新分類名稱" maxlength="6">
          <button id="btnAddCat">新增</button>
        </div>
      </div>

      <!-- 帳戶管理與數據備份 -->
      <div class="manage-box" style="margin-top:16px;">
        <div class="stat-title" style="margin-bottom:8px;">💳 管理帳戶</div>
        <div class="m-list" id="manageAccList"></div>
        <div class="m-add">
          <input type="text" id="newAccName" placeholder="新帳戶名稱（如：信用卡）" maxlength="10" style="flex:1">
          <button id="btnAddAcc">新增</button>
        </div>
      </div>

      <div class="data-actions">
        <button id="exportBtn">匯出備份</button>
        <button id="importBtn">匯入備份</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </main>
</div>

<nav class="tabbar">
  <button class="tab on" data-view="list">明細</button>
  <button class="fab" id="fabAdd">+</button>
  <button class="tab" data-view="stats">統計/設置</button>
</nav>

<div class="overlay" id="overlay"></div>

<!-- 記帳面板 -->
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div class="seg" id="seg">
    <button class="on" data-type="expense">支出</button>
    <button data-type="income">收入</button>
  </div>
  <div class="amount-row">
    <span class="cur">$</span>
    <input id="amtInput" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
  </div>
  
  <div class="sec-title">選擇分類</div>
  <div class="cat-grid" id="catGrid"></div>
  
  <div class="sec-title">記帳帳戶</div>
  <div class="acc-grid" id="accGrid"></div>

  <div class="meta">
    <input type="date" id="dateInput">
    <input type="text" id="noteInput" placeholder="備註（選填）" maxlength="20">
  </div>
  <div class="sheet-actions">
    <button class="btn-del" id="btnDel" hidden>刪除</button>
    <button class="btn-save" id="btnSave">儲存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

// 預設數據
const DEFAULT_CATS = {
  expense: [
    {id:'food',      name:'餐飲', emoji:'🍜'},
    {id:'transport', name:'交通', emoji:'🚌'},
    {id:'shopping',  name:'購物', emoji:'🛍️'},
    {id:'home',      name:'居家', emoji:'🏠'},
    {id:'fun',       name:'娛樂', emoji:'🎮'},
    {id:'health',    name:'醫療', emoji:'💊'},
    {id:'study',     name:'學習', emoji:'📚'},
    {id:'social',    name:'人情', emoji:'🎁'},
    {id:'bill',      name:'帳單', emoji:'📄'},
    {id:'other',     name:'其他', emoji:'📦'}
  ],
  income: [
    {id:'salary',   name:'薪水', emoji:'💰'},
    {id:'bonus',    name:'獎金', emoji:'🎉'},
    {id:'invest',   name:'投資', emoji:'📈'},
    {id:'parttime', name:'兼職', emoji:'💼'},
    {id:'gift',     name:'紅包', emoji:'🧧'},
    {id:'other',    name:'其他', emoji:'📦'}
  ]
};
const DEFAULT_ACCS = ['現金', '借記卡', 'WeChat', 'Alipay', 'QQ錢包'];

// 存儲 Key
const KEY_REC = 'ledger.v3.records';
const KEY_CAT = 'ledger.v3.cats';
const KEY_ACC = 'ledger.v3.accs';

// 狀態
let records = loadData(KEY_REC, []);
let myCats  = loadData(KEY_CAT, DEFAULT_CATS);
let myAccs  = loadData(KEY_ACC, DEFAULT_ACCS);

let curMonth = todayStr().slice(0,7);
let curView  = 'list';
let editId   = null;
let curType  = 'expense';
let curCatId = myCats.expense[0].id;
let curAccName = myAccs[0];

let manageType = 'expense'; // 分類管理當前切換的狀態

/* ---------- 工具 ---------- */
function loadData(key, fallback){
  try{ 
    const d = JSON.parse(localStorage.getItem(key)); 
    return (d !== null && typeof d === 'object') ? d : fallback; 
  }
  catch(e){ return fallback; }
}
function saveAllData(){
  localStorage.setItem(KEY_REC, JSON.stringify(records));
  localStorage.setItem(KEY_CAT, JSON.stringify(myCats));
  localStorage.setItem(KEY_ACC, JSON.stringify(myAccs));
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return ymd(new Date()); }
function money(n){
  const v = Math.round(n*100)/100;
  return v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function catOf(type,id){
  return (myCats[type]||[]).find(c=>c.id===id) || {emoji:'❓',name:'其他'};
}
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 1600);
}

/* ---------- 渲染主界面 ---------- */
function render(){
  const y = curMonth.slice(0,4), m = Number(curMonth.slice(5,7));
  $('monthLabel').textContent = `${y}年${m}月`;

  const rs = records.filter(r => r.date.startsWith(curMonth));
  const income  = rs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  const expense = rs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);

  $('sIncome').textContent  = '$' + money(income);
  $('sExpense').textContent = '$' + money(expense);
  $('sBalance').textContent = '$' + money(income - expense);

  renderList(rs);
  renderStats(rs);
}

function renderList(rs){
  const box = $('list');
  if(!rs.length){
    box.innerHTML = '<div class="empty">這個月還沒有紀錄<br><span>點下方 + 開始記帳</span></div>';
    return;
  }
  const groups = {};
  rs.forEach(r => (groups[r.date] = groups[r.date] || []).push(r));

  let html = '';
  Object.keys(groups).sort().reverse().forEach(d => {
    const items = groups[d].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const out = items.filter(i=>i.type==='expense').reduce((s,i)=>s+i.amount,0);
    const inc = items.filter(i=>i.type==='income').reduce((s,i)=>s+i.amount,0);
    const parts = [];
    if(out) parts.push('支出 ' + money(out));
    if(inc) parts.push('收入 ' + money(inc));

    html += `<div class="day">
      <div class="day-head"><span>${dayLabel(d)}</span><span>${parts.join(' · ')}</span></div>`;
    items.forEach(it => {
      const c = catOf(it.type, it.cat);
      html += `<div class="item" data-id="${it.id}">
        <div class="ico ${it.type}">${c.emoji}</div>
        <div class="info">
          <div class="name">${esc(c.name)}
            <span class="tag-acc">${esc(it.account || '未分類')}</span>
            ${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}
          </div>
        </div>
        <div class="amt ${it.type}">${it.type==='expense'?'−':'+'}${money(it.amount)}</div>
      </div>`;
    });
    html += '</div>';
  });
  box.innerHTML = html;
}

function dayLabel(d){
  const t = todayStr();
  if(d === t) return '今天';
  const y = new Date(); y.setDate(y.getDate()-1);
  if(d === ymd(y)) return '昨天';
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getMonth()+1}月${dt.getDate()}日 週${'日一二三四五六'[dt.getDay()]}`;
}

/* ---------- 渲染統計與設置 ---------- */
function renderStats(rs){
  $('stats').innerHTML = statBlock(rs,'expense','支出') + statBlock(rs,'income','收入');
  renderManageCats();
  renderManageAccs();
}

function statBlock(rs, type, title){
  const items = rs.filter(r => r.type === type);
  if(!items.length) return '';
  const map = new Map();
  items.forEach(r => map.set(r.cat, (map.get(r.cat)||0) + r.amount));
  const arr = [...map].map(([id, amt]) => {
    const c = catOf(type, id);
    return {emoji:c.emoji, name:c.name, amt};
  }).sort((a,b)=>b.amt-a.amt);

  const max = arr[0].amt;
  const total = arr.reduce((s,x)=>s+x.amt,0);

  return `<div class="stat-block">
    <div class="stat-title">${title} · 共 ${money(total)}</div>
    ${arr.map(x => `<div class="stat-row">
      <div class="n">${x.emoji} ${esc(x.name)}</div>
      <div class="bar ${type==='income'?'in':''}"><i style="width:${Math.max(4, x.amt/max*100)}%"></i></div>
      <div class="v">${money(x.amt)}</div>
    </div>`).join('')}
  </div>`;
}

function renderManageCats(){
  const list = myCats[manageType] || [];
  $('manageList').innerHTML = list.map(c => `
    <div class="m-item">
      <span>${c.emoji} ${esc(c.name)}</span>
      <button class="m-del" data-cat="${c.id}">×</button>
    </div>
  `).join('');
}

function renderManageAccs(){
  $('manageAccList').innerHTML = myAccs.map(a => `
    <div class="m-item">
      <span>💳 ${esc(a)}</span>
      ${myAccs.length > 1 ? `<button class="m-del" data-acc="${esc(a)}">×</button>` : ''}
    </div>
  `).join('');
}

/* ---------- 月份切換 / 視圖 ---------- */
function shiftMonth(n){
  const [y,m] = curMonth.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  curMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function switchView(v){
  curView = v;
  $('viewList').hidden  = v !== 'list';
  $('viewStats').hidden = v !== 'stats';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === v));
}

/* ---------- 記帳面板 ---------- */
function defaultDate(){
  const t = todayStr();
  return t.startsWith(curMonth) ? t : curMonth + '-01';
}
function renderCatsAndAccs(){
  // 渲染分類
  const list = myCats[curType] || [];
  if(!list.some(c=>c.id===curCatId)) curCatId = list.length > 0 ? list[0].id : null;
  
  $('catGrid').innerHTML = list.map(c =>
    `<button class="cat ${c.id===curCatId?'on':''}" data-cat="${c.id}">
       <span>${c.emoji}</span>${c.name}
     </button>`
  ).join('');

  // 渲染帳戶
  if(!myAccs.includes(curAccName)) curAccName = myAccs[0];
  $('accGrid').innerHTML = myAccs.map(a =>
    `<button class="acc ${a===curAccName?'on':''}" data-acc="${esc(a)}">${esc(a)}</button>`
  ).join('');
}

function openSheet(rec){
  editId  = rec ? rec.id : null;
  curType = rec ? rec.type : 'expense';
  curCatId = rec ? rec.cat : (myCats.expense[0] ? myCats.expense[0].id : null);
  curAccName = rec ? (rec.account || myAccs[0]) : myAccs[0];

  $('amtInput').value  = rec ? String(rec.amount) : '';
  $('noteInput').value = rec ? (rec.note||'') : '';
  $('dateInput').value = rec ? rec.date : defaultDate();
  $('btnDel').hidden   = !rec;

  document.querySelectorAll('#seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.type === curType));
  renderCatsAndAccs();

  $('overlay').classList.add('on');
  $('sheet').classList.add('on');
  if(!rec) setTimeout(()=>$('amtInput').focus(), 340);
}
function closeSheet(){
  $('overlay').classList.remove('on');
  $('sheet').classList.remove('on');
  $('amtInput').blur();
  $('noteInput').blur();
}
function saveRecord(){
  const amt = parseFloat($('amtInput').value);
  if(!amt || amt <= 0){ toast('請輸入金額'); return; }
  if(!curCatId){ toast('請選擇分類'); return; }

  const date = $('dateInput').value || defaultDate();
  const note = $('noteInput').value.trim();

  if(editId){
    const r = records.find(x=>x.id===editId);
    if(r) Object.assign(r, {type:curType, amount:amt, cat:curCatId, account:curAccName, date, note});
  }else{
    records.push({
      id: uid(), type: curType, amount: amt, cat: curCatId, account: curAccName,
      date, note, createdAt: Date.now()
    });
  }
  saveAllData();
  closeSheet();
  curMonth = date.slice(0,7);
  render();
  toast(editId ? '已更新' : '已記下');
  editId = null;
}
function deleteRecord(){
  if(!editId) return;
  if(!confirm('確定要刪除這筆紀錄嗎？')) return;
  records = records.filter(r => r.id !== editId);
  saveAllData(); closeSheet(); render(); toast('已刪除');
  editId = null;
}

/* ---------- 匯出 / 匯入 ---------- */
function exportData(){
  const backup = { records, myCats, myAccs };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ledger-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('備份已匯出');
}
function importData(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      // 兼容舊版（只有數組）和新版（對象包含records, myCats, myAccs）
      if(Array.isArray(data)){
        records = data; // 舊版直接覆蓋紀錄
      } else if(data.records){
        if(confirm('匯入備份會覆蓋現有的數據，包含自定義的分類和帳戶，確定嗎？')){
          records = data.records;
          if(data.myCats) myCats = data.myCats;
          if(data.myAccs) myAccs = data.myAccs;
        } else return;
      }
      saveAllData(); render();
      toast('備份已還原');
    }catch(err){ toast('檔案格式錯誤'); }
  };
  reader.readAsText(file);
}

/* ---------- 事件綁定 ---------- */
$('prevM').onclick = () => shiftMonth(-1);
$('nextM').onclick = () => shiftMonth(1);
$('fabAdd').onclick = () => openSheet(null);
$('overlay').onclick = closeSheet;
$('btnSave').onclick = saveRecord;
$('btnDel').onclick = deleteRecord;

$('exportBtn').onclick = exportData;
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  if(e.target.files[0]) importData(e.target.files[0]);
  e.target.value = '';
};

document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => switchView(b.dataset.view);
});

// 記帳類型切換
document.querySelectorAll('#seg button').forEach(b => {
  b.onclick = () => {
    curType = b.dataset.type;
    curCatId = myCats[curType].length > 0 ? myCats[curType][0].id : null;
    document.querySelectorAll('#seg button').forEach(x =>
      x.classList.toggle('on', x.dataset.type === curType));
    renderCatsAndAccs();
  };
});

// 選擇分類
$('catGrid').addEventListener('click', e => {
  const btn = e.target.closest('.cat');
  if(!btn) return;
  curCatId = btn.dataset.cat;
  document.querySelectorAll('.cat').forEach(x =>
    x.classList.toggle('on', x.dataset.cat === curCatId));
});

// 選擇帳戶
$('accGrid').addEventListener('click', e => {
  const btn = e.target.closest('.acc');
  if(!btn) return;
  curAccName = btn.dataset.acc;
  document.querySelectorAll('.acc').forEach(x =>
    x.classList.toggle('on', x.dataset.acc === curAccName));
});

// 點擊紀錄修改
$('list').addEventListener('click', e => {
  const el = e.target.closest('.item');
  if(!el) return;
  const rec = records.find(r => r.id === el.dataset.id);
  if(rec) openSheet(rec);
});

// 金額輸入限制
$('amtInput').addEventListener('input', e => {
  let v = e.target.value.replace(/[^\d.]/g, '');
  const p = v.split('.');
  if(p.length > 2) v = p[0] + '.' + p.slice(1).join('');
  const q = v.split('.');
  if(q[1] && q[1].length > 2) v = q[0] + '.' + q[1].slice(0,2);
  if(v.startsWith('.')) v = '0' + v;
  e.target.value = v;
});

/* ---------- 管理分類/帳戶事件 ---------- */
// 切換管理收支分類
document.querySelectorAll('#manageSeg button').forEach(b => {
  b.onclick = () => {
    manageType = b.dataset.mtype;
    document.querySelectorAll('#manageSeg button').forEach(x =>
      x.classList.toggle('on', x.dataset.mtype === manageType));
    renderManageCats();
  };
});

// 新增分類
$('btnAddCat').onclick = () => {
  const emoji = $('newCatEmoji').value.trim() || '📌';
  const name  = $('newCatName').value.trim();
  if(!name) { toast('請輸入分類名稱'); return; }
  
  const newId = 'c_' + uid();
  myCats[manageType].push({ id: newId, name, emoji });
  saveAllData();
  
  $('newCatEmoji').value = '';
  $('newCatName').value = '';
  renderManageCats();
  renderCatsAndAccs(); // 同步更新記帳面板
  toast('分類已新增');
};

// 刪除分類
$('manageList').addEventListener('click', e => {
  const btn = e.target.closest('.m-del');
  if(!btn) return;
  const catId = btn.dataset.cat;
  if(confirm('刪除後，已使用該分類的記帳紀錄將顯示為「其他」。確定刪除？')){
    myCats[manageType] = myCats[manageType].filter(c => c.id !== catId);
    saveAllData();
    renderManageCats();
    renderCatsAndAccs();
    toast('已刪除');
  }
});

// 新增帳戶
$('btnAddAcc').onclick = () => {
  const name = $('newAccName').value.trim();
  if(!name) { toast('請輸入帳戶名稱'); return; }
  if(myAccs.includes(name)) { toast('帳戶已存在'); return; }
  
  myAccs.push(name);
  saveAllData();
  $('newAccName').value = '';
  renderManageAccs();
  renderCatsAndAccs();
  toast('帳戶已新增');
};

// 刪除帳戶
$('manageAccList').addEventListener('click', e => {
  const btn = e.target.closest('.m-del');
  if(!btn) return;
  const accName = btn.dataset.acc;
  if(confirm(`刪除帳戶「${accName}」？該帳戶的歷史記帳仍會保留，但顯示為「未分類」。`)){
    myAccs = myAccs.filter(a => a !== accName);
    saveAllData();
    renderManageAccs();
    renderCatsAndAccs();
    toast('已刪除');
  }
});

// 啟動
render();
switchView('list');
</script>
</body>
</html>
